services:
  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_DATABASE: wealth
      MYSQL_USER: wealth
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10
volumes:
  mysql_data:
